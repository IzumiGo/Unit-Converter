<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="top-body" >
            <h1>Metric/Imperial Unit Conversion</h1>
            <input id="input-el" type="text">
            <button id="convert-btn" >
                Convert
            </button>
        </div>
        <div id="bottom-body" >
            <div class="metric-box" >
                <h3 class="first-p" >Length (Meter/Feet)</h3>
                <p class="second-p" id="length" ></p>
            </div>
            <div class="metric-box" >
                <h3 class="first-p" >Volume (Liters/Gallons)</h3>
                <p class="second-p" id="volume" ></p>
            </div>
            <div class="metric-box" >
                <h3 class="first-p" >Mass (Kilograms/Pounds)</h3>
                <p class="second-p" id="mass" ></p>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
